name: Build and Release

on:
  push:
    tags:
      - 'v*'

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  IS_PERSONAL: ${{ contains(github.ref, 'personal') }}
  ANDROID_NDK_VERSION: '27.3.13750724'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            arch: arm64-v8a
            rust-target: aarch64-linux-android
            flutter-target: android-arm64
          - platform: android
            os: ubuntu-latest
            arch: armeabi-v7a
            rust-target: armv7-linux-androideabi
            flutter-target: android-arm
          - platform: android
            os: ubuntu-latest
            arch: x86_64
            rust-target: x86_64-linux-android
            flutter-target: android-x64
          - platform: ios
            os: macos-latest
          - platform: macos
            os: macos-latest
            arch: arm64
            excluded-arch: x86_64
          - platform: macos
            os: macos-latest
            arch: x86_64
            excluded-arch: arm64
          - platform: windows
            os: windows-2022
            arch: x86_64

    steps:
      # ubuntu-latest 可用空间仅 ~14GB,Flutter+NDK+Rust 缓存+Gradle 产物会把盘写满,
      # 先删掉本构建用不到的预装组件,约可腾出 25GB+
      - name: Free disk space
        if: startsWith(matrix.platform, 'android')
        run: |
          echo "清理前:" && df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android/sdk/ndk \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/share/chromium
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "清理后:" && df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        if: startsWith(matrix.platform, 'android')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/doh_proxy
          key: ${{ matrix.platform }}-${{ matrix.arch || 'default' }}

      - name: Setup iOS Rust targets
        if: matrix.platform == 'ios'
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Setup macOS Rust targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Setup Android build environment
        if: startsWith(matrix.platform, 'android')
        run: |
          rustup target add ${{ matrix.rust-target }}
          cargo install cargo-ndk
          sudo apt-get update && sudo apt-get install -y cmake

      - name: Setup Android NDK
        if: startsWith(matrix.platform, 'android')
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;${{ env.ANDROID_NDK_VERSION }}'

      - name: Configure Android NDK path
        if: startsWith(matrix.platform, 'android')
        run: |
          ndk_path="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          test -d "${ndk_path}"
          echo "ANDROID_NDK_HOME=${ndk_path}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk_path}" >> "${GITHUB_ENV}"

      # Optional personal-branch signing. Without secrets, Gradle falls back to
      # debug signing so Android APKs still build for self-use releases.
      - name: Setup Android Signing (optional)
        if: startsWith(matrix.platform, 'android')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ] && [ -n "${ANDROID_KEY_PROPERTIES}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/app/upload-keystore.jks
            echo "${ANDROID_KEY_PROPERTIES}" > android/key.properties
            echo "Using release keystore from secrets"
          else
            echo "No Android signing secrets; APK will use debug signing fallback"
          fi
          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            echo "${GOOGLE_SERVICES_JSON}" | base64 -d > android/app/google-services.json
          else
            echo "Using committed google-services.json"
          fi

      - name: Configure Git for CocoaPods
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"

      - name: Build Android
        if: startsWith(matrix.platform, 'android')
        run: |
          dart tool/flutterw.dart build apk --release --target-platform ${{ matrix.flutter-target }} --dart-define=cronetHttpNoPlay=true --split-debug-info=build/symbols
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep "lib/${{ matrix.arch }}/libdoh_proxy.so"
          cmp -s core/doh_proxy/certs/ca.der android/app/src/main/res/raw/proxy_ca.der
          cmp -s core/doh_proxy/certs/ca.crt assets/certs/proxy_ca.pem
          mkdir -p dist
          mv build/app/outputs/flutter-apk/app-release.apk dist/fluxdo-${{ matrix.arch }}.apk

      - name: Archive Dart symbols
        if: startsWith(matrix.platform, 'android')
        uses: actions/upload-artifact@v4
        with:
          name: dart-symbols-${{ matrix.arch }}
          path: build/symbols
          retention-days: 90
          if-no-files-found: error

      - name: Build iOS
        if: matrix.platform == 'ios'
        run: |
          dart tool/flutterw.dart build ios --release --no-codesign
          nm -gU build/ios/iphoneos/Runner.app/Runner | grep "_doh_proxy_start_with_config_json"
          mkdir -p dist
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r fluxdo-unsigned.ipa Payload
          mv fluxdo-unsigned.ipa ../../../dist/

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: npm install -g appdmg

      - name: Build macOS
        if: matrix.platform == 'macos'
        env:
          FLUXDO_MACOS_ARCH: ${{ matrix.arch }}
          FLUTTER_XCODE_EXCLUDED_ARCHS: ${{ matrix.excluded-arch }}
        run: |
          dart tool/flutterw.dart build macos --release
          mkdir -p dist
          APP_PATH="build/macos/Build/Products/Release/fluxdo.app"
          test -f "$APP_PATH/Contents/Frameworks/libdoh_proxy.dylib"
          test -f "$APP_PATH/Contents/Resources/native/doh_proxy_bin"
          test -x "$APP_PATH/Contents/Resources/native/doh_proxy_bin"
          lipo -archs "$APP_PATH/Contents/MacOS/fluxdo" | grep -qw "${{ matrix.arch }}"
          lipo -archs "$APP_PATH/Contents/Frameworks/libdoh_proxy.dylib" | grep -qw "${{ matrix.arch }}"

      - name: Package macOS DMG
        if: matrix.platform == 'macos'
        run: |
          cat > dmg-config.json << 'DMGEOF'
          {
            "title": "Fluxdo",
            "contents": [
              { "x": 448, "y": 344, "type": "link", "path": "/Applications" },
              { "x": 192, "y": 344, "type": "file", "path": "build/macos/Build/Products/Release/fluxdo.app" }
            ],
            "window": {
              "size": { "width": 660, "height": 500 }
            }
          }
          DMGEOF
          appdmg dmg-config.json "dist/fluxdo-macos-${{ matrix.arch }}.dmg"

      - name: Setup NuGet
        if: matrix.platform == 'windows'
        uses: nuget/setup-nuget@v2

      - name: Setup NASM
        if: matrix.platform == 'windows'
        uses: ilammy/setup-nasm@v1

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: |
          dart tool/flutterw.dart build windows --release
          $releaseDir = "build\\windows\\x64\\runner\\Release"
          if (-not (Test-Path "$releaseDir\\native\\doh_proxy.dll")) { throw "Missing doh_proxy.dll" }
          if (-not (Test-Path "$releaseDir\\native\\doh_proxy_bin.exe")) { throw "Missing doh_proxy_bin.exe" }
          mkdir dist

      - name: Package Windows ZIP
        if: matrix.platform == 'windows'
        run: |
          cd build\windows\x64\runner\Release
          7z a -tzip "..\..\..\..\..\dist\fluxdo-windows-x86_64.zip" .

      - name: Build Windows Installer (exe)
        if: matrix.platform == 'windows'
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version windows\setup.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          pattern: artifact-*
          merge-multiple: true

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes (cliff)
        id: cliff_notes
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *personal* ]]; then
            PREV=$(git tag --list 'v*-personal.*' --sort=-creatordate | sed -n '2p' || true)
            EXTRA=(--ignore-tags '.*-(alpha|beta|rc|personal).*')
          else
            PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
            EXTRA=()
          fi
          if [ -n "$PREV" ]; then RANGE="${PREV}..${TAG}"; else RANGE="$TAG"; fi
          echo "::notice::release notes 范围 = ${RANGE}"
          git cliff "$RANGE" "${EXTRA[@]}" --strip header --output release_notes.md
          git cliff "$RANGE" "${EXTRA[@]}" --strip all --output release_notes.txt
          cp release_notes.md release_notes_tg.md

      - name: Fallback - Generate release notes (legacy)
        if: steps.cliff_notes.outcome == 'failure'
        run: |
          TAG="${{ github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="${PREV}..${TAG}"; else RANGE="$TAG"; fi
          {
            echo "## Changes"
            echo
            git log --no-merges --pretty=format:"- %s" "$RANGE"
            echo
          } > release_notes.md
          cp release_notes.md release_notes.txt
          cp release_notes.md release_notes_tg.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: release_notes.md
          draft: false
          prerelease: ${{ env.IS_STABLE != 'true' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
